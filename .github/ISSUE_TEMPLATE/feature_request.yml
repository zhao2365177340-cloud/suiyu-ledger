name: 功能建议
description: 提出一个功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明使用场景与目标，而不是只描述实现方式。由于项目采用非商业许可，商业定制请通过主页联系作者。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在是怎么做的？哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 App 如何解决？可选：界面草图、参考产品
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个功能与「本地优先、无账号、无广告」的定位一致
          required: true
        - label: 我愿意在 Issue 中继续讨论，而不是直接提交大改动 PR
          required: true
